services:
  postgres:
    image: postgres:18
    container_name: korp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: korp_inventory
    ports:
      - "5432:5432"
    volumes:
      - korp_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d korp_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  korp_postgres_data:
